name: CI

on:
  push:
    branches: [main, vibe]
  pull_request:
    branches: [main, vibe]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # `npm test` also runs `npm run build`, so the packaged artifacts exist by now.
      - name: Check packaged files
        run: node .github/workflows/scripts/check-package.mjs

  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Builds the flake's checks, which reuse the package definition and run
      # `npm test` inside the Nix build sandbox (verifies npmDeps and the build).
      - run: nix flake check -L
